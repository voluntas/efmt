id = "efmt"
name = "efmt"
description = "Erlang code formatter (efmt) language server"
version = "0.21.0"
schema_version = 1
authors = ["Takeru Ohta <phjgt308@gmail.com>"]
repository = "https://github.com/sile/efmt"

[grammars.erlang]
repository = "https://github.com/AbstractMachinesLab/tree-sitter-erlang"
commit = "3a9c769444f08bbccce03845270efac0c641c5e7"

[language_servers.efmt-lsp]
name = "efmt LSP"
languages = ["Erlang"]

[[capabilities]]
kind = "process:exec"
command = "efmt-lsp"
args = ["**"]
